apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: resilient-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: backend, tier: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:8080", "-text=backend ok"]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: app-config } }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: resilient-app }
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 8080, targetPort: http }]
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: backend, namespace: resilient-app }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: backend } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend, namespace: resilient-app }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown: { stabilizationWindowSeconds: 60 }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
