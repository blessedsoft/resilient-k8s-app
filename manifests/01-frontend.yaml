apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: resilient-app
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location = /health { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
      location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location / { return 200 'resilient frontend\n'; add_header Content-Type text/plain; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: resilient-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: frontend, tier: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
      volumes:
        - { name: config, configMap: { name: frontend-nginx-config } }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: resilient-app }
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: frontend, namespace: resilient-app }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: frontend } }
